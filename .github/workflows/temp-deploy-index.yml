name: Temp deploy - replace index.html
on:
  workflow_dispatch:
jobs:
  replace-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new build
        run: |
          mv pentacle-crown-simulator.html index.html
          git config user.name "Cajun-lab"
          git config user.email "Cajun-lab@users.noreply.github.com"
          git add -A
          git commit -m "Deploy updated simulator build as index.html"
          git push
