name: Temp Deploy Index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename temporary build to index.html
        run: |
          set -e
          if [ -f index-v09-temp.html ]; then
            mv index-v09-temp.html index.html
          elif [ -f pentacle-crown-simulator.html ]; then
            mv pentacle-crown-simulator.html index.html
          else
            echo "No temporary build found" >&2
            ls -la
            exit 1
          fi
          ls -lh index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy updated simulator build as index.html"
            git push
          fi
